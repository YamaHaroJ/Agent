<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #guide-path {
      fill: none;
      stroke: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="guide-path"></path>
      <path id="second-block"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var guidePath = document.getElementById('guide-path');
      var secondBlock = document.getElementById('second-block');

      var totalLength = 0;
      var blockLength = 40;
      var blockThickness = 40;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function squircleScreenPath(w, h) {
        var cx = w / 2;
        var cy = h / 2;
        var a = w / 2;
        var b = h / 2;
        var n = 2.6;
        var power = 2 / n;
        var samples = 900;
        var parts = [];

        for (var i = 0; i <= samples; i++) {
          var t = -Math.PI / 2 + (Math.PI * 2 * i / samples);
          var c = Math.cos(t);
          var s = Math.sin(t);

          var x = cx + a * Math.sign(c) * Math.pow(Math.abs(c), power);
          var y = cy + b * Math.sign(s) * Math.pow(Math.abs(s), power);

          parts.push((i === 0 ? 'M ' : 'L ') + x.toFixed(3) + ' ' + y.toFixed(3));
        }

        parts.push('Z');
        return parts.join(' ');
      }

      function setupPath() {
        var w = window.innerWidth;
        var h = window.innerHeight;

        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        guidePath.setAttribute('d', squircleScreenPath(w, h));
        totalLength = guidePath.getTotalLength();

        drawSecondBlock(new Date());
      }

      function wrapLength(v) {
        if (!totalLength) return 0;
        v %= totalLength;
        if (v < 0) v += totalLength;
        return v;
      }

      function pointAndInwardNormal(length) {
        var s = wrapLength(length);
        var delta = 0.75;

        var p = guidePath.getPointAtLength(s);
        var before = guidePath.getPointAtLength(wrapLength(s - delta));
        var after = guidePath.getPointAtLength(wrapLength(s + delta));

        var tx = after.x - before.x;
        var ty = after.y - before.y;
        var mag = Math.hypot(tx, ty) || 1;

        tx /= mag;
        ty /= mag;

        /* Clockwise path: rotate tangent +90° to point inward. */
        var nx = -ty;
        var ny = tx;

        return {
          x: p.x,
          y: p.y,
          nx: nx,
          ny: ny
        };
      }

      function offsetPoint(length, offset) {
        var p = pointAndInwardNormal(length);

        return {
          x: p.x + p.nx * offset,
          y: p.y + p.ny * offset
        };
      }

      function hitBoundaryFromInside(p, dx, dy, w, h) {
        var bestT = Infinity;
        var edge = '';
        var t;

        if (dx > 0.000001) {
          t = (w - p.x) / dx;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'right'; }
        } else if (dx < -0.000001) {
          t = (0 - p.x) / dx;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'left'; }
        }

        if (dy > 0.000001) {
          t = (h - p.y) / dy;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'bottom'; }
        } else if (dy < -0.000001) {
          t = (0 - p.y) / dy;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'top'; }
        }

        return {
          x: p.x + dx * bestT,
          y: p.y + dy * bestT,
          edge: edge
        };
      }

      function sharedCorner(edgeA, edgeB, w, h) {
        if (
          (edgeA === 'top' && edgeB === 'right') ||
          (edgeA === 'right' && edgeB === 'top')
        ) return { x: w, y: 0 };

        if (
          (edgeA === 'right' && edgeB === 'bottom') ||
          (edgeA === 'bottom' && edgeB === 'right')
        ) return { x: w, y: h };

        if (
          (edgeA === 'bottom' && edgeB === 'left') ||
          (edgeA === 'left' && edgeB === 'bottom')
        ) return { x: 0, y: h };

        if (
          (edgeA === 'left' && edgeB === 'top') ||
          (edgeA === 'top' && edgeB === 'left')
        ) return { x: 0, y: 0 };

        return null;
      }

      function drawSecondBlock(d) {
        if (!totalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var start = (seconds / 60) * totalLength;
        var midDistance = start + blockLength / 2;

        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w / 2;
        var cy = h / 2;

        /*
          Keep the long exaggerated n=2.6 motion.
          The moving point on the guide curve determines where the marker is.
        */
        var mid = guidePath.getPointAtLength(wrapLength(midDistance));

        /*
          Project that moving point outward to the real rectangular
          screen boundary so the marker stays pinned to the physical edge.
        */
        var rx = mid.x - cx;
        var ry = mid.y - cy;

        var sx = Math.abs(rx) > 0.0001 ? (w / 2) / Math.abs(rx) : Infinity;
        var sy = Math.abs(ry) > 0.0001 ? (h / 2) / Math.abs(ry) : Infinity;
        var scaleToEdge = Math.min(sx, sy);

        var edgeX = cx + rx * scaleToEdge;
        var edgeY = cy + ry * scaleToEdge;

        /*
          NEW ORIENTATION RULE:

          Do NOT point toward the exact screen center.

          Instead, use a second point that follows the marker just inside
          the perimeter. That point moves with the second marker, so the
          fixed inner edge stays parallel to the local edge/curve instead
          of aiming radially at one central point.
        */
        var local = pointAndInwardNormal(midDistance);

        var inwardX = local.nx;
        var inwardY = local.ny;

        /*
          Ensure the normal really points into the screen.
        */
        var testX = edgeX + inwardX * 4;
        var testY = edgeY + inwardY * 4;

        if (
          testX < 0 || testX > w ||
          testY < 0 || testY > h
        ) {
          inwardX *= -1;
          inwardY *= -1;
        }

        var inwardMag = Math.hypot(inwardX, inwardY) || 1;
        inwardX /= inwardMag;
        inwardY /= inwardMag;

        /*
          The fixed edge is perpendicular to the moving inward direction,
          so it stays parallel to the nearby screen edge.
        */
        var tangentX = -inwardY;
        var tangentY = inwardX;

        var half = blockLength / 2;
        var margin = 0.5;

        function innerEdgeAt(depth) {
          var icx = edgeX + inwardX * depth;
          var icy = edgeY + inwardY * depth;

          return {
            a: {
              x: icx - tangentX * half,
              y: icy - tangentY * half
            },
            b: {
              x: icx + tangentX * half,
              y: icy + tangentY * half
            }
          };
        }

        function fullyInside(edge) {
          return (
            edge.a.x >= margin &&
            edge.a.x <= w - margin &&
            edge.a.y >= margin &&
            edge.a.y <= h - margin &&
            edge.b.x >= margin &&
            edge.b.x <= w - margin &&
            edge.b.y >= margin &&
            edge.b.y <= h - margin
          );
        }

        /*
          Keep the inner edge exactly 40px whenever possible.
          Near a corner, move that unchanged edge farther inward only
          enough to keep all 40px visible.
        */
        var innerDepth = blockThickness;
        var fixedEdge = innerEdgeAt(innerDepth);

        if (!fullyInside(fixedEdge)) {
          var low = blockThickness;
          var high = Math.hypot(w, h);

          for (var n = 0; n < 16; n++) {
            var testDepth = (low + high) / 2;
            var testEdge = innerEdgeAt(testDepth);

            if (fullyInside(testEdge)) {
              high = testDepth;
            } else {
              low = testDepth;
            }
          }

          innerDepth = high;
          fixedEdge = innerEdgeAt(innerDepth);
        }

        var innerA = fixedEdge.a;
        var innerB = fixedEdge.b;

        /*
          The other two sides stretch outward to the real screen edge.
        */
        var outerA = hitBoundaryFromInside(
          innerA, -inwardX, -inwardY, w, h
        );

        var outerB = hitBoundaryFromInside(
          innerB, -inwardX, -inwardY, w, h
        );

        var parts = [
          'M ' + innerA.x.toFixed(3) + ' ' + innerA.y.toFixed(3),
          'L ' + outerA.x.toFixed(3) + ' ' + outerA.y.toFixed(3)
        ];

        /*
          If those sides land on adjacent physical edges, bend only the
          OUTER edge around the shared corner. The inner 40px edge remains
          straight and unchanged.
        */
        var corner = sharedCorner(outerA.edge, outerB.edge, w, h);

        if (corner) {
          parts.push(
            'Q ' +
            corner.x.toFixed(3) + ' ' + corner.y.toFixed(3) + ' ' +
            outerB.x.toFixed(3) + ' ' + outerB.y.toFixed(3)
          );
        } else {
          parts.push(
            'L ' + outerB.x.toFixed(3) + ' ' + outerB.y.toFixed(3)
          );
        }

        parts.push(
          'L ' + innerB.x.toFixed(3) + ' ' + innerB.y.toFixed(3),
          'L ' + innerA.x.toFixed(3) + ' ' + innerA.y.toFixed(3),
          'Z'
        );

        secondBlock.setAttribute('d', parts.join(' '));
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);

      setupPath();
      update();
    })();
  </script>
</body>
</html>
