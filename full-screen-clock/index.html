<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="second-block"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var secondBlock = document.getElementById('second-block');

      var screenW = 0;
      var screenH = 0;

      var blockDepth = 40;
      var blockWidth = 40;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function setup() {
        screenW = window.innerWidth;
        screenH = window.innerHeight;

        svg.setAttribute('viewBox', '0 0 ' + screenW + ' ' + screenH);
        drawSecondBlock(new Date());
      }

      /*
        One minute is split into 8 equal movements:

        00.0  top-middle
        07.5  top-right corner
        15.0  right-middle
        22.5  bottom-right corner
        30.0  bottom-middle
        37.5  bottom-left corner
        45.0  left-middle
        52.5  top-left corner
        60.0  top-middle

        So every edge midpoint is the moment the marker is perfectly straight.
        Everywhere else its inner edge points toward the exact screen center.
      */
      function perimeterPoint(progress) {
        progress = ((progress % 1) + 1) % 1;

        var segment = progress * 8;
        var index = Math.floor(segment) % 8;
        var t = segment - Math.floor(segment);

        var w = screenW;
        var h = screenH;

        switch (index) {
          case 0:
            return { x: w / 2 + (w / 2) * t, y: 0 };

          case 1:
            return { x: w, y: (h / 2) * t };

          case 2:
            return { x: w, y: h / 2 + (h / 2) * t };

          case 3:
            return { x: w - (w / 2) * t, y: h };

          case 4:
            return { x: w / 2 - (w / 2) * t, y: h };

          case 5:
            return { x: 0, y: h - (h / 2) * t };

          case 6:
            return { x: 0, y: h / 2 - (h / 2) * t };

          default:
            return { x: (w / 2) * t, y: 0 };
        }
      }

      function polarPoint(cx, cy, radius, angle) {
        return {
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius
        };
      }

      function drawSecondBlock(d) {
        if (!screenW || !screenH) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;

        var boundary = perimeterPoint(progress);

        var cx = screenW / 2;
        var cy = screenH / 2;

        var dx = boundary.x - cx;
        var dy = boundary.y - cy;

        var boundaryRadius = Math.hypot(dx, dy);
        if (!boundaryRadius) return;

        var angle = Math.atan2(dy, dx);

        /*
          Half the 40px depth is inside the screen and half is outside.
          The SVG viewport clips the outside half naturally.
        */
        var innerRadius = boundaryRadius - blockDepth / 2;
        var outerRadius = boundaryRadius + blockDepth / 2;

        /*
          Make the inner arc approximately 40px wide.
          Because it is a circular arc centered on the exact screen center,
          every point on that inside edge literally faces the center.
        */
        var halfAngle = Math.asin(
          Math.min(0.95, (blockWidth / 2) / Math.max(innerRadius, blockWidth))
        );

        var samples = 18;
        var outer = [];
        var inner = [];

        for (var i = 0; i <= samples; i++) {
          var u = i / samples;
          var a = angle - halfAngle + (halfAngle * 2 * u);

          outer.push(polarPoint(cx, cy, outerRadius, a));
          inner.push(polarPoint(cx, cy, innerRadius, a));
        }

        var parts = [];

        parts.push(
          'M',
          outer[0].x.toFixed(3),
          outer[0].y.toFixed(3)
        );

        for (var j = 1; j < outer.length; j++) {
          parts.push(
            'L',
            outer[j].x.toFixed(3),
            outer[j].y.toFixed(3)
          );
        }

        for (var k = inner.length - 1; k >= 0; k--) {
          parts.push(
            'L',
            inner[k].x.toFixed(3),
            inner[k].y.toFixed(3)
          );
        }

        parts.push('Z');

        secondBlock.setAttribute('d', parts.join(' '));
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setup);

      setup();
      update();
    })();
  </script>
</body>
</html>
