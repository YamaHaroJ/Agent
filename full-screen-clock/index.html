<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #second-path {
      fill: none;
      stroke: #fff;
      stroke-width: 40;
      stroke-linecap: butt;
      stroke-linejoin: round;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="second-path"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var secondPath = document.getElementById('second-path');

      var totalLength = 0;
      var blockSize = 40;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function roundedScreenPath(w, h, r) {
        var cx = w / 2;

        /* Start at exact top center: this is the 00-second position. */
        return [
          'M', cx, 0,
          'H', w - r,
          'Q', w, 0, w, r,
          'V', h - r,
          'Q', w, h, w - r, h,
          'H', r,
          'Q', 0, h, 0, h - r,
          'V', r,
          'Q', 0, 0, r, 0,
          'H', cx,
          'Z'
        ].join(' ');
      }

      function setupPath() {
        var w = window.innerWidth;
        var h = window.innerHeight;

        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        /*
          The path runs directly on the viewport edge.
          Because the stroke is 40px thick, exactly half of the
          conceptual 40×40 block sits outside the screen on straight edges.
          At corners, the same block becomes a genuine curved arc.
        */
        var radius = Math.max(
          56,
          Math.min(86, Math.min(w, h) * 0.085)
        );

        secondPath.setAttribute('d', roundedScreenPath(w, h, radius));

        totalLength = secondPath.getTotalLength();

        /*
          One 40px dash around one closed perimeter.
          Pattern length equals the perimeter so 59 → 00 stays continuous.
        */
        secondPath.style.strokeDasharray =
          blockSize + ' ' + (totalLength - blockSize);
      }

      function setSecondBlock(d) {
        if (!totalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;

        secondPath.style.strokeDashoffset =
          String(-(progress * totalLength));
      }

      function update() {
        var now = new Date();

        setClock(now);
        setSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);

      setupPath();
      update();
    })();
  </script>
</body>
</html>
