<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="second-block"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var secondBlock = document.getElementById('second-block');

      var screenW = 0;
      var screenH = 0;

      var depth = 40;
      var width = 40;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function setup() {
        screenW = window.innerWidth;
        screenH = window.innerHeight;
        svg.setAttribute('viewBox', '0 0 ' + screenW + ' ' + screenH);
        drawSecondBlock(new Date());
      }

      /*
        00 top-middle
        07.5 top-right
        15 right-middle
        22.5 bottom-right
        30 bottom-middle
        37.5 bottom-left
        45 left-middle
        52.5 top-left
        60 top-middle

        This keeps the long, gradual tilt you liked.
      */
      function perimeterPoint(progress) {
        progress = ((progress % 1) + 1) % 1;

        var s = progress * 8;
        var i = Math.floor(s) % 8;
        var t = s - Math.floor(s);
        var w = screenW;
        var h = screenH;

        switch (i) {
          case 0: return { x: w/2 + (w/2)*t, y: 0 };
          case 1: return { x: w, y: (h/2)*t };
          case 2: return { x: w, y: h/2 + (h/2)*t };
          case 3: return { x: w - (w/2)*t, y: h };
          case 4: return { x: w/2 - (w/2)*t, y: h };
          case 5: return { x: 0, y: h - (h/2)*t };
          case 6: return { x: 0, y: h/2 - (h/2)*t };
          default:return { x: (w/2)*t, y: 0 };
        }
      }

      function hitScreenFromInside(p, dx, dy) {
        var bestT = Infinity;
        var edge = '';
        var t;

        if (dx > 0.000001) {
          t = (screenW - p.x) / dx;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'right'; }
        } else if (dx < -0.000001) {
          t = (0 - p.x) / dx;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'left'; }
        }

        if (dy > 0.000001) {
          t = (screenH - p.y) / dy;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'bottom'; }
        } else if (dy < -0.000001) {
          t = (0 - p.y) / dy;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'top'; }
        }

        return {
          x: p.x + dx * bestT,
          y: p.y + dy * bestT,
          edge: edge
        };
      }

      function cornerBetween(a, b) {
        var pair = a + '-' + b;
        var reverse = b + '-' + a;

        if (pair === 'top-right' || reverse === 'top-right') {
          return { x: screenW, y: 0 };
        }

        if (pair === 'right-bottom' || reverse === 'right-bottom') {
          return { x: screenW, y: screenH };
        }

        if (pair === 'bottom-left' || reverse === 'bottom-left') {
          return { x: 0, y: screenH };
        }

        if (pair === 'left-top' || reverse === 'left-top') {
          return { x: 0, y: 0 };
        }

        return null;
      }

      function drawSecondBlock(d) {
        if (!screenW || !screenH) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;

        var edgeCenter = perimeterPoint(progress);

        var cx = screenW / 2;
        var cy = screenH / 2;

        /*
          Inward direction ALWAYS points to the exact center.
        */
        var ux = cx - edgeCenter.x;
        var uy = cy - edgeCenter.y;
        var mag = Math.hypot(ux, uy) || 1;

        ux /= mag;
        uy /= mag;

        /*
          The inside edge is perpendicular to that center-facing direction.
          So the WHOLE flat inner face points toward screen center.
        */
        var tx = -uy;
        var ty = ux;

        var halfW = width / 2;

        /*
          Inner face is 40px inward from the edge.
        */
        var innerCenter = {
          x: edgeCenter.x + ux * depth,
          y: edgeCenter.y + uy * depth
        };

        var innerA = {
          x: innerCenter.x - tx * halfW,
          y: innerCenter.y - ty * halfW
        };

        var innerB = {
          x: innerCenter.x + tx * halfW,
          y: innerCenter.y + ty * halfW
        };

        /*
          Extend each end of the inner face straight outward until it
          physically hits the screen boundary. No clipping = no diamonds.
        */
        var outerA = hitScreenFromInside(innerA, -ux, -uy);
        var outerB = hitScreenFromInside(innerB, -ux, -uy);

        var parts = [
          'M', innerA.x.toFixed(3), innerA.y.toFixed(3),
          'L', outerA.x.toFixed(3), outerA.y.toFixed(3)
        ];

        /*
          When the two outer corners land on adjacent screen edges,
          wrap the marker around the actual corner rather than cutting
          diagonally across it.
        */
        var corner = cornerBetween(outerA.edge, outerB.edge);

        if (corner) {
          /*
            Quadratic corner wrap: smooth bend toward/away from the
            screen corner instead of a hard diamond point.
          */
          parts.push(
            'Q',
            corner.x.toFixed(3), corner.y.toFixed(3),
            outerB.x.toFixed(3), outerB.y.toFixed(3)
          );
        } else {
          parts.push(
            'L',
            outerB.x.toFixed(3), outerB.y.toFixed(3)
          );
        }

        parts.push(
          'L', innerB.x.toFixed(3), innerB.y.toFixed(3),
          'L', innerA.x.toFixed(3), innerA.y.toFixed(3),
          'Z'
        );

        secondBlock.setAttribute('d', parts.join(' '));
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setup);

      setup();
      update();
    })();
  </script>
</body>
</html>
