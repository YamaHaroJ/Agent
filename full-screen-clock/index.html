<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #guide-path {
      fill: none;
      stroke: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }
      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="guide-path"></path>
      <path id="second-block"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var guidePath = document.getElementById('guide-path');
      var secondBlock = document.getElementById('second-block');

      var totalLength = 0;
      var blockThickness = 40;
      var blockLength = 40;
      var endSlant = 10;
      var edgeOffset = 4;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function roundedRectPath(x, y, w, h, r) {
        var cx = x + (w / 2);

        return [
          'M', cx, y,
          'H', x + w - r,
          'Q', x + w, y, x + w, y + r,
          'V', y + h - r,
          'Q', x + w, y + h, x + w - r, y + h,
          'H', x + r,
          'Q', x, y + h, x, y + h - r,
          'V', y + r,
          'Q', x, y, x + r, y,
          'H', cx,
          'Z'
        ].join(' ');
      }

      function setupPath() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        /*
          The reference keeps most of the moving square outside the viewport.
          Only its inner slice is visible on straight edges. At a corner,
          the same square naturally becomes a curved ribbon as it follows
          the rounded perimeter.
        */
        var inset = -edgeOffset;
        var radius = Math.max(38, Math.min(64, Math.min(w, h) * 0.07));

        guidePath.setAttribute(
          'd',
          roundedRectPath(
            inset,
            inset,
            w - inset * 2,
            h - inset * 2,
            radius
          )
        );

        totalLength = guidePath.getTotalLength();
      }

      function wrapLength(v) {
        if (!totalLength) return 0;
        v %= totalLength;
        if (v < 0) v += totalLength;
        return v;
      }

      function pointAndNormal(length) {
        var delta = 0.6;
        var s = wrapLength(length);
        var before = guidePath.getPointAtLength(wrapLength(s - delta));
        var after = guidePath.getPointAtLength(wrapLength(s + delta));
        var p = guidePath.getPointAtLength(s);

        var tx = after.x - before.x;
        var ty = after.y - before.y;
        var mag = Math.hypot(tx, ty) || 1;
        tx /= mag;
        ty /= mag;

        /* Inward normal for our clockwise screen path. */
        var nx = -ty;
        var ny = tx;

        return { x: p.x, y: p.y, nx: nx, ny: ny };
      }

      function boundaryPoint(length, inwardAmount) {
        var q = pointAndNormal(length);
        return {
          x: q.x + q.nx * inwardAmount,
          y: q.y + q.ny * inwardAmount
        };
      }

      function setSegment(d) {
        if (!totalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var start = (seconds / 60) * totalLength;
        var samples = 22;
        var half = blockThickness / 2;

        /*
          The outer edge is shifted slightly forward relative to the inner edge.
          That gives the block the same slanted/raked ends as the reference,
          while both long edges physically follow the rounded screen perimeter.
        */
        var outerStart = start + endSlant;
        var innerStart = start;
        var outer = [];
        var inner = [];

        for (var i = 0; i <= samples; i++) {
          var t = i / samples;
          outer.push(
            boundaryPoint(outerStart + blockLength * t, -half)
          );
          inner.push(
            boundaryPoint(innerStart + blockLength * t, half)
          );
        }

        var parts = [];
        parts.push('M ' + outer[0].x + ' ' + outer[0].y);

        for (var j = 1; j < outer.length; j++) {
          parts.push('L ' + outer[j].x + ' ' + outer[j].y);
        }

        for (var k = inner.length - 1; k >= 0; k--) {
          parts.push('L ' + inner[k].x + ' ' + inner[k].y);
        }

        parts.push('Z');
        secondBlock.setAttribute('d', parts.join(' '));
      }

      function update() {
        var now = new Date();
        setClock(now);
        setSegment(now);
        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);
      setupPath();
      update();
    })();
  </script>
</body>
</html>
