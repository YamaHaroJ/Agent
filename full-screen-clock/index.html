<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100%;
      min-width: 100%;
    }

    #app {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #guide-path {
      fill: none;
      stroke: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock {
        top: 39%;
        font-size: min(17vw, 36vh);
      }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="guide-path"></path>
      <path id="second-block"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var guidePath = document.getElementById('guide-path');
      var secondBlock = document.getElementById('second-block');

      var totalLength = 0;
      var blockLength = 40;
      var blockThickness = 40;
      var layoutW = 0;
      var layoutH = 0;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function squircleScreenPath(w, h) {
        var cx = w / 2;
        var cy = h / 2;
        var a = w / 2;
        var b = h / 2;
        var n = 2.6;
        var power = 2 / n;
        var samples = 900;
        var parts = [];

        for (var i = 0; i <= samples; i++) {
          var t = -Math.PI / 2 + (Math.PI * 2 * i / samples);
          var c = Math.cos(t);
          var s = Math.sin(t);

          var x = cx + a * Math.sign(c) * Math.pow(Math.abs(c), power);
          var y = cy + b * Math.sign(s) * Math.pow(Math.abs(s), power);

          parts.push((i === 0 ? 'M ' : 'L ') + x.toFixed(3) + ' ' + y.toFixed(3));
        }

        parts.push('Z');
        return parts.join(' ');
      }

      function setupPath() {
        /*
          In iPad Home Screen mode window.innerHeight can stop above the
          physical bottom safe-area. Use the rendered full-screen SVG size
          instead so the second ribbon actually reaches the bottom edge.
        */
        var rect = svg.getBoundingClientRect();
        var w = rect.width;
        var h = rect.height;

        layoutW = w;
        layoutH = h;

        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        guidePath.setAttribute('d', squircleScreenPath(w, h));
        totalLength = guidePath.getTotalLength();

        drawSecondBlock(new Date());
      }

      function wrapLength(v) {
        if (!totalLength) return 0;
        v %= totalLength;
        if (v < 0) v += totalLength;
        return v;
      }

      function pointAndInwardNormal(length) {
        var s = wrapLength(length);
        var delta = 0.75;

        var p = guidePath.getPointAtLength(s);
        var before = guidePath.getPointAtLength(wrapLength(s - delta));
        var after = guidePath.getPointAtLength(wrapLength(s + delta));

        var tx = after.x - before.x;
        var ty = after.y - before.y;
        var mag = Math.hypot(tx, ty) || 1;

        tx /= mag;
        ty /= mag;

        /* Clockwise path: rotate tangent +90° to point inward. */
        var nx = -ty;
        var ny = tx;

        return {
          x: p.x,
          y: p.y,
          nx: nx,
          ny: ny
        };
      }

      function offsetPoint(length, offset) {
        var p = pointAndInwardNormal(length);

        return {
          x: p.x + p.nx * offset,
          y: p.y + p.ny * offset
        };
      }

      function hitBoundaryFromInside(p, dx, dy, w, h) {
        var bestT = Infinity;
        var edge = '';
        var t;

        if (dx > 0.000001) {
          t = (w - p.x) / dx;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'right'; }
        } else if (dx < -0.000001) {
          t = (0 - p.x) / dx;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'left'; }
        }

        if (dy > 0.000001) {
          t = (h - p.y) / dy;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'bottom'; }
        } else if (dy < -0.000001) {
          t = (0 - p.y) / dy;
          if (t >= 0 && t < bestT) { bestT = t; edge = 'top'; }
        }

        return {
          x: p.x + dx * bestT,
          y: p.y + dy * bestT,
          edge: edge
        };
      }

      function sharedCorner(edgeA, edgeB, w, h) {
        if (
          (edgeA === 'top' && edgeB === 'right') ||
          (edgeA === 'right' && edgeB === 'top')
        ) return { x: w, y: 0 };

        if (
          (edgeA === 'right' && edgeB === 'bottom') ||
          (edgeA === 'bottom' && edgeB === 'right')
        ) return { x: w, y: h };

        if (
          (edgeA === 'bottom' && edgeB === 'left') ||
          (edgeA === 'left' && edgeB === 'bottom')
        ) return { x: 0, y: h };

        if (
          (edgeA === 'left' && edgeB === 'top') ||
          (edgeA === 'top' && edgeB === 'left')
        ) return { x: 0, y: 0 };

        return null;
      }

      function pointOnInsetRoundedRectFromCenter(source, inset) {
        var w = layoutW || svg.getBoundingClientRect().width;
        var h = layoutH || svg.getBoundingClientRect().height;
        var cx = w / 2;
        var cy = h / 2;

        var dx = source.x - cx;
        var dy = source.y - cy;
        var len = Math.hypot(dx, dy) || 1;

        var ux = dx / len;
        var uy = dy / len;

        var sx = ux >= 0 ? 1 : -1;
        var sy = uy >= 0 ? 1 : -1;
        var ax = Math.abs(ux);
        var ay = Math.abs(uy);

        var halfW = Math.max(1, w / 2 - inset);
        var halfH = Math.max(1, h / 2 - inset);

        /*
          Small, iPad-like corner radius.
          Intentionally subtle so we only smooth the corner cutout
          without changing the movement or making the screen look pill-shaped.
        */
        /*
          Use the SAME modest radius for both the outer perimeter and
          the inner follow-edge. The previous version reduced the inner
          radius, which is what created that visible square cutout.
        */
        var screenCornerRadius = 32;
        var r = Math.max(
          0,
          Math.min(screenCornerRadius, halfW, halfH)
        );

        if (r < 0.001) {
          var rectScaleX = ax > 0.000001 ? halfW / ax : Infinity;
          var rectScaleY = ay > 0.000001 ? halfH / ay : Infinity;
          var rectT = Math.min(rectScaleX, rectScaleY);

          return {
            x: cx + sx * ax * rectT,
            y: cy + sy * ay * rectT
          };
        }

        var sideX = halfW - r;
        var sideY = halfH - r;

        if (ax > 0.000001) {
          var tV = halfW / ax;
          var yV = ay * tV;

          if (yV <= sideY + 0.000001) {
            return {
              x: cx + sx * halfW,
              y: cy + sy * yV
            };
          }
        }

        if (ay > 0.000001) {
          var tH = halfH / ay;
          var xH = ax * tH;

          if (xH <= sideX + 0.000001) {
            return {
              x: cx + sx * xH,
              y: cy + sy * halfH
            };
          }
        }

        /*
          Ray / quarter-circle intersection for the rounded corner.
          The motion itself is untouched; only the boundary shape changes.
        */
        var qa = ax * ax + ay * ay;
        var qb = -2 * (ax * sideX + ay * sideY);
        var qc = sideX * sideX + sideY * sideY - r * r;
        var disc = Math.max(0, qb * qb - 4 * qa * qc);

        var t1 = (-qb - Math.sqrt(disc)) / (2 * qa);
        var t2 = (-qb + Math.sqrt(disc)) / (2 * qa);
        var t = Math.max(t1, t2);

        return {
          x: cx + sx * ax * t,
          y: cy + sy * ay * t
        };
      }

      function drawSecondBlock(d) {
        if (!totalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var start = (seconds / 60) * totalLength;

        /*
          FLOWING RIBBON:
          Every point across the marker is mapped independently.

          - outer boundary follows the physical screen edge
          - inner boundary follows the same edge shape, just inset 40px
          - both boundaries warp together through corners
          - no rigid square, no center-point rotation, no triangle collapse
        */
        var samples = 28;
        var outer = [];
        var inner = [];
        var endSlant = 11;

        /*
          Slant BOTH ends symmetrically:
          the outside edge starts a little earlier and ends a little later,
          while the inside edge keeps the original 40px length.
          This makes the two end faces lean outward in opposite directions.
        */
        for (var i = 0; i <= samples; i++) {
          var t = i / samples;

          var outerDistance =
            start - endSlant +
            (blockLength + endSlant * 2) * t;

          var innerDistance =
            start + blockLength * t;

          var outerGuide =
            guidePath.getPointAtLength(wrapLength(outerDistance));

          var innerGuide =
            guidePath.getPointAtLength(wrapLength(innerDistance));

          outer.push(
            pointOnInsetRoundedRectFromCenter(outerGuide, 0)
          );

          inner.push(
            pointOnInsetRoundedRectFromCenter(innerGuide, blockThickness)
          );
        }

        var parts = [];

        parts.push(
          'M ' + outer[0].x.toFixed(3) + ' ' + outer[0].y.toFixed(3)
        );

        for (var j = 1; j < outer.length; j++) {
          parts.push(
            'L ' + outer[j].x.toFixed(3) + ' ' + outer[j].y.toFixed(3)
          );
        }

        for (var k = inner.length - 1; k >= 0; k--) {
          parts.push(
            'L ' + inner[k].x.toFixed(3) + ' ' + inner[k].y.toFixed(3)
          );
        }

        parts.push('Z');

        secondBlock.setAttribute('d', parts.join(' '));
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);

      setupPath();
      update();
    })();
  </script>
</body>
</html>
