<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>\n  <link rel="preconnect" href="https://fonts.googleapis.com">\n  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #second-path {
      fill: none;
      stroke: #fff;
      stroke-width: 40;
      stroke-linecap: butt;
      stroke-linejoin: round;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }
      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="second-path"></path>
    </svg>

    <div id="clock">12:00:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var secondPath = document.getElementById('second-path');

      var totalLength = 0;
      var segmentLength = 0;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function roundedRectPath(x, y, w, h, r) {
        var cx = x + (w / 2);

        /* Start the perimeter at the exact top-center so 00 seconds lands here. */
        return [
          'M', cx, y,
          'H', x + w - r,
          'Q', x + w, y, x + w, y + r,
          'V', y + h - r,
          'Q', x + w, y + h, x + w - r, y + h,
          'H', x + r,
          'Q', x, y + h, x, y + h - r,
          'V', y + r,
          'Q', x, y, x + r, y,
          'H', cx,
          'Z'
        ].join(' ');
      }

      function setupPath() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        var blockThickness = 40;
        var inset = blockThickness / 2;
        var radius = Math.max(38, Math.min(64, Math.min(w, h) * 0.07));

        var d = roundedRectPath(
          inset,
          inset,
          w - inset * 2,
          h - inset * 2,
          radius
        );

        secondPath.setAttribute('d', d);

        totalLength = secondPath.getTotalLength();

        /* 40px long × 40px thick = square on straight edges. */
        segmentLength = blockThickness;

        /*
          The dash pattern is exactly one full perimeter long.
          That means when the square crosses the 59→00 seam,
          the part leaving the end continues immediately at the start
          instead of disappearing and popping back in.
        */
        secondPath.style.strokeDasharray =
          segmentLength + ' ' + (totalLength - segmentLength);
      }

      function setSegment(d) {
        if (!totalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;

        secondPath.style.strokeDashoffset =
          String(-(progress * totalLength));
      }

      function update() {
        var now = new Date();
        setClock(now);
        setSegment(now);
        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);
      setupPath();
      update();
    })();
  </script>
</body>
</html>
