<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #physical-path {
      fill: none;
      stroke: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <clipPath id="screen-clip">
          <rect id="screen-clip-rect"></rect>
        </clipPath>
      </defs>

      <path id="physical-path"></path>

      <g clip-path="url(#screen-clip)">
        <path id="second-block"></path>
      </g>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var physicalPath = document.getElementById('physical-path');
      var secondBlock = document.getElementById('second-block');
      var clipRect = document.getElementById('screen-clip-rect');

      var physicalLength = 0;
      var blockSize = 40;
      var screenW = 0;
      var screenH = 0;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function roundedEdgePath(w, h, r) {
        var cx = w / 2;

        return [
          'M', cx, 0,
          'H', w - r,
          'Q', w, 0, w, r,
          'V', h - r,
          'Q', w, h, w - r, h,
          'H', r,
          'Q', 0, h, 0, h - r,
          'V', r,
          'Q', 0, 0, r, 0,
          'H', cx,
          'Z'
        ].join(' ');
      }

      function setupPaths() {
        screenW = window.innerWidth;
        screenH = window.innerHeight;

        var cornerRadius = Math.max(
          34,
          Math.min(52, Math.min(screenW, screenH) * 0.05)
        );

        svg.setAttribute('viewBox', '0 0 ' + screenW + ' ' + screenH);

        clipRect.setAttribute('x', '0');
        clipRect.setAttribute('y', '0');
        clipRect.setAttribute('width', screenW);
        clipRect.setAttribute('height', screenH);
        clipRect.setAttribute('rx', cornerRadius);
        clipRect.setAttribute('ry', cornerRadius);

        physicalPath.setAttribute(
          'd',
          roundedEdgePath(screenW, screenH, cornerRadius)
        );

        physicalLength = physicalPath.getTotalLength();

        drawSecondBlock(new Date());
      }

      function drawSecondBlock(d) {
        if (!physicalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;
        var distance = progress * physicalLength;

        var center = physicalPath.getPointAtLength(distance);

        /*
          Critical rule:
          the INNER face of the square always points at the exact
          center of the screen.

          That makes the marker:
          - perfectly straight only at edge midpoints
          - immediately tilt as it leaves a midpoint
          - progressively tilt more toward each corner
          - stay correctly oriented through the corner
        */
        var cx = screenW / 2;
        var cy = screenH / 2;

        var inwardX = cx - center.x;
        var inwardY = cy - center.y;
        var inwardMag = Math.hypot(inwardX, inwardY) || 1;

        inwardX /= inwardMag;
        inwardY /= inwardMag;

        /*
          Tangent is perpendicular to the inward normal.
          The square's inner edge lies along this tangent.
        */
        var tangentX = -inwardY;
        var tangentY = inwardX;

        var half = blockSize / 2;

        /*
          Put the square center exactly on the physical screen boundary.
          Half of the square is therefore outside the viewport and clipped.
        */
        var outerCenterX = center.x - inwardX * half;
        var outerCenterY = center.y - inwardY * half;
        var innerCenterX = center.x + inwardX * half;
        var innerCenterY = center.y + inwardY * half;

        var p1 = {
          x: outerCenterX - tangentX * half,
          y: outerCenterY - tangentY * half
        };

        var p2 = {
          x: outerCenterX + tangentX * half,
          y: outerCenterY + tangentY * half
        };

        var p3 = {
          x: innerCenterX + tangentX * half,
          y: innerCenterY + tangentY * half
        };

        var p4 = {
          x: innerCenterX - tangentX * half,
          y: innerCenterY - tangentY * half
        };

        secondBlock.setAttribute(
          'd',
          [
            'M', p1.x.toFixed(3), p1.y.toFixed(3),
            'L', p2.x.toFixed(3), p2.y.toFixed(3),
            'L', p3.x.toFixed(3), p3.y.toFixed(3),
            'L', p4.x.toFixed(3), p4.y.toFixed(3),
            'Z'
          ].join(' ')
        );
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPaths);

      setupPaths();
      update();
    })();
  </script>
</body>
</html>
