<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #physical-path,
    #angle-path {
      fill: none;
      stroke: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <clipPath id="screen-clip">
          <rect id="screen-clip-rect"></rect>
        </clipPath>
      </defs>

      <path id="physical-path"></path>
      <path id="angle-path"></path>

      <g clip-path="url(#screen-clip)">
        <path id="second-block"></path>
      </g>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var physicalPath = document.getElementById('physical-path');
      var anglePath = document.getElementById('angle-path');
      var secondBlock = document.getElementById('second-block');
      var clipRect = document.getElementById('screen-clip-rect');

      var physicalLength = 0;
      var angleLength = 0;
      var blockSize = 40;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      /*
        This is ONLY used for the marker's angle.
        n = 2.6 keeps the long, exaggerated tilt you liked.
      */
      function squirclePath(w, h) {
        var cx = w / 2;
        var cy = h / 2;
        var a = w / 2;
        var b = h / 2;
        var n = 2.6;
        var power = 2 / n;
        var samples = 900;
        var parts = [];

        for (var i = 0; i <= samples; i++) {
          var t = -Math.PI / 2 + (Math.PI * 2 * i / samples);
          var c = Math.cos(t);
          var s = Math.sin(t);

          var x = cx + a * Math.sign(c) * Math.pow(Math.abs(c), power);
          var y = cy + b * Math.sign(s) * Math.pow(Math.abs(s), power);

          parts.push((i === 0 ? 'M ' : 'L ') + x.toFixed(3) + ' ' + y.toFixed(3));
        }

        parts.push('Z');
        return parts.join(' ');
      }

      /*
        This is the ACTUAL position path.
        It hugs the real screen edge and uses a clean rounded corner.
      */
      function roundedEdgePath(w, h, r) {
        var cx = w / 2;

        return [
          'M', cx, 0,
          'H', w - r,
          'Q', w, 0, w, r,
          'V', h - r,
          'Q', w, h, w - r, h,
          'H', r,
          'Q', 0, h, 0, h - r,
          'V', r,
          'Q', 0, 0, r, 0,
          'H', cx,
          'Z'
        ].join(' ');
      }

      function setupPaths() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cornerRadius = Math.max(34, Math.min(52, Math.min(w, h) * 0.05));

        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        clipRect.setAttribute('x', '0');
        clipRect.setAttribute('y', '0');
        clipRect.setAttribute('width', w);
        clipRect.setAttribute('height', h);
        clipRect.setAttribute('rx', cornerRadius);
        clipRect.setAttribute('ry', cornerRadius);

        physicalPath.setAttribute('d', roundedEdgePath(w, h, cornerRadius));
        anglePath.setAttribute('d', squirclePath(w, h));

        physicalLength = physicalPath.getTotalLength();
        angleLength = anglePath.getTotalLength();

        drawSecondBlock(new Date());
      }

      function wrap(v, length) {
        if (!length) return 0;
        v %= length;
        if (v < 0) v += length;
        return v;
      }

      function tangentAt(path, length, distance) {
        var delta = 0.8;
        var before = path.getPointAtLength(wrap(distance - delta, length));
        var after = path.getPointAtLength(wrap(distance + delta, length));

        var tx = after.x - before.x;
        var ty = after.y - before.y;
        var mag = Math.hypot(tx, ty) || 1;

        return {
          x: tx / mag,
          y: ty / mag
        };
      }

      function drawSecondBlock(d) {
        if (!physicalLength || !angleLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;

        /*
          Position follows the clean rounded screen edge.
          Angle follows the exaggerated squircle.
          This keeps the long drawn-out tilt without letting the marker
          drift inward or warp around the corners.
        */
        var centerDistance = progress * physicalLength;
        var angleDistance = progress * angleLength;

        var center = physicalPath.getPointAtLength(centerDistance);
        var tangent = tangentAt(anglePath, angleLength, angleDistance);

        var nx = -tangent.y;
        var ny = tangent.x;
        var half = blockSize / 2;

        var p1 = {
          x: center.x - tangent.x * half - nx * half,
          y: center.y - tangent.y * half - ny * half
        };

        var p2 = {
          x: center.x + tangent.x * half - nx * half,
          y: center.y + tangent.y * half - ny * half
        };

        var p3 = {
          x: center.x + tangent.x * half + nx * half,
          y: center.y + tangent.y * half + ny * half
        };

        var p4 = {
          x: center.x - tangent.x * half + nx * half,
          y: center.y - tangent.y * half + ny * half
        };

        secondBlock.setAttribute(
          'd',
          [
            'M', p1.x.toFixed(3), p1.y.toFixed(3),
            'L', p2.x.toFixed(3), p2.y.toFixed(3),
            'L', p3.x.toFixed(3), p3.y.toFixed(3),
            'L', p4.x.toFixed(3), p4.y.toFixed(3),
            'Z'
          ].join(' ')
        );
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPaths);

      setupPaths();
      update();
    })();
  </script>
</body>
</html>
