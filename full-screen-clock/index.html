<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>
  <style>
    :root {
      --tick-short: 8px;
      --tick-long: 16px;
      --edge: max(4px, env(safe-area-inset-top));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      letter-spacing: -0.045em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #ticks {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .tick {
      position: absolute;
      background: rgba(255,255,255,.22);
      transition: background .12s ease, opacity .12s ease;
    }

    .tick.active {
      background: #fff;
      opacity: 1;
    }

    .tick.top, .tick.bottom {
      width: 2px;
      height: var(--tick-short);
      transform: translateX(-50%);
    }
    .tick.top { top: 0; }
    .tick.bottom { bottom: 0; }

    .tick.left, .tick.right {
      width: var(--tick-short);
      height: 2px;
      transform: translateY(-50%);
    }
    .tick.left { left: 0; }
    .tick.right { right: 0; }

    .tick.major.top, .tick.major.bottom { height: var(--tick-long); }
    .tick.major.left, .tick.major.right { width: var(--tick-long); }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }
      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Full screen clock">
    <div id="ticks" aria-hidden="true"></div>
    <div id="clock">12:00:00 AM</div>

    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    const clock = document.getElementById('clock');
    const ticks = document.getElementById('ticks');
    const soundcloud = document.getElementById('soundcloud');

    const tickEls = [];

    function buildTicks() {
      ticks.replaceChildren();
      tickEls.length = 0;

      for (let i = 0; i < 60; i++) {
        const t = document.createElement('span');
        t.className = 'tick' + (i % 5 === 0 ? ' major' : '');

        const sideIndex = Math.floor(i / 15);
        const pos = i % 15;
        const pct = (pos / 15) * 100;

        if (sideIndex === 0) {
          t.classList.add('top');
          t.style.left = pct + '%';
        } else if (sideIndex === 1) {
          t.classList.add('right');
          t.style.top = pct + '%';
        } else if (sideIndex === 2) {
          t.classList.add('bottom');
          t.style.right = pct + '%';
        } else {
          t.classList.add('left');
          t.style.bottom = pct + '%';
        }

        ticks.appendChild(t);
        tickEls.push(t);
      }
    }

    function updateClock() {
      const d = new Date();
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');
      const suffix = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;

      clock.textContent = h + ':' + m + ':' + s + ' ' + suffix;

      const sec = d.getSeconds();
      tickEls.forEach((el, i) => el.classList.toggle('active', i === sec));
    }

    function startClock() {
      updateClock();
      const delay = 1000 - (Date.now() % 1000);
      setTimeout(() => {
        updateClock();
        setInterval(updateClock, 1000);
      }, delay);
    }

    soundcloud.addEventListener('click', () => {
      window.location.href = 'https://soundcloud.com/';
    });

    buildTicks();
    startClock();
    window.addEventListener('resize', buildTicks);
  </script>
</body>
</html>
