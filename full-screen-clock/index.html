<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      letter-spacing: -0.045em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #second-segment {
      position: absolute;
      z-index: 3;
      background: rgba(255,255,255,.95);
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(255,255,255,.18);
      pointer-events: none;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 4;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }
      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Full screen clock">
    <div id="second-segment" aria-hidden="true"></div>
    <div id="clock">12:00:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var segment = document.getElementById('second-segment');
      var soundcloud = document.getElementById('soundcloud');

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var s = String(d.getSeconds()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ':' + s + ' ' + suffix;
      }

      function setSegment(second) {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var longSide = Math.max(w, h);
        var length = Math.max(42, Math.min(longSide * 0.055, 92));
        var thickness = 4;
        var side = Math.floor(second / 15);
        var step = second % 15;
        var progress = step / 14;

        segment.style.left = 'auto';
        segment.style.right = 'auto';
        segment.style.top = 'auto';
        segment.style.bottom = 'auto';

        if (side === 0) {
          var x1 = progress * (w - length);
          segment.style.width = length + 'px';
          segment.style.height = thickness + 'px';
          segment.style.left = x1 + 'px';
          segment.style.top = '0px';
        } else if (side === 1) {
          var y1 = progress * (h - length);
          segment.style.width = thickness + 'px';
          segment.style.height = length + 'px';
          segment.style.right = '0px';
          segment.style.top = y1 + 'px';
        } else if (side === 2) {
          var x2 = progress * (w - length);
          segment.style.width = length + 'px';
          segment.style.height = thickness + 'px';
          segment.style.right = x2 + 'px';
          segment.style.bottom = '0px';
        } else {
          var y2 = progress * (h - length);
          segment.style.width = thickness + 'px';
          segment.style.height = length + 'px';
          segment.style.left = '0px';
          segment.style.bottom = y2 + 'px';
        }
      }

      function update() {
        var now = new Date();
        setClock(now);
        setSegment(now.getSeconds());
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      update();
      window.setInterval(update, 250);
      window.addEventListener('resize', update);
    })();
  </script>
</body>
</html>
