<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    #guide-path {
      fill: none;
      stroke: none;
    }

    #second-block {
      fill: #fff;
      stroke: none;
      pointer-events: none;
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: italic;
      transform: translate(-50%, -50%) skewX(-10deg);
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }

      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="guide-path"></path>
      <path id="second-block"></path>
    </svg>

    <div id="clock">12:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var guidePath = document.getElementById('guide-path');
      var secondBlock = document.getElementById('second-block');

      var totalLength = 0;
      var blockLength = 40;
      var blockThickness = 40;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';

        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ' ' + suffix;
      }

      function squircleScreenPath(w, h) {
        var cx = w / 2;
        var cy = h / 2;
        var a = w / 2;
        var b = h / 2;
        var n = 2.6;
        var power = 2 / n;
        var samples = 900;
        var parts = [];

        for (var i = 0; i <= samples; i++) {
          var t = -Math.PI / 2 + (Math.PI * 2 * i / samples);
          var c = Math.cos(t);
          var s = Math.sin(t);

          var x = cx + a * Math.sign(c) * Math.pow(Math.abs(c), power);
          var y = cy + b * Math.sign(s) * Math.pow(Math.abs(s), power);

          parts.push((i === 0 ? 'M ' : 'L ') + x.toFixed(3) + ' ' + y.toFixed(3));
        }

        parts.push('Z');
        return parts.join(' ');
      }

      function setupPath() {
        var w = window.innerWidth;
        var h = window.innerHeight;

        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        guidePath.setAttribute('d', squircleScreenPath(w, h));
        totalLength = guidePath.getTotalLength();

        drawSecondBlock(new Date());
      }

      function wrapLength(v) {
        if (!totalLength) return 0;
        v %= totalLength;
        if (v < 0) v += totalLength;
        return v;
      }

      function pointAndInwardNormal(length) {
        var s = wrapLength(length);
        var delta = 0.75;

        var p = guidePath.getPointAtLength(s);
        var before = guidePath.getPointAtLength(wrapLength(s - delta));
        var after = guidePath.getPointAtLength(wrapLength(s + delta));

        var tx = after.x - before.x;
        var ty = after.y - before.y;
        var mag = Math.hypot(tx, ty) || 1;

        tx /= mag;
        ty /= mag;

        /* Clockwise path: rotate tangent +90° to point inward. */
        var nx = -ty;
        var ny = tx;

        return {
          x: p.x,
          y: p.y,
          nx: nx,
          ny: ny
        };
      }

      function offsetPoint(length, offset) {
        var p = pointAndInwardNormal(length);

        return {
          x: p.x + p.nx * offset,
          y: p.y + p.ny * offset
        };
      }

      function drawSecondBlock(d) {
        if (!totalLength) return;

        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var start = (seconds / 60) * totalLength;

        /*
          Build a real solid strip instead of using SVG dashes.
          The strip follows the squircle tangent continuously:
          straight at each edge midpoint, progressively tilted toward
          a corner, curved through it, then progressively straight again.
        */
        var samples = 18;
        var half = blockThickness / 2;
        var outer = [];
        var inner = [];

        /*
          Keep the exaggerated squircle bend/orientation, but move the
          whole marker outward until its midpoint sits on the actual
          rectangular screen boundary. This preserves the long drawn-out
          tilt while keeping the marker pushed against the edge.
        */
        var midDistance = start + blockLength / 2;
        var mid = guidePath.getPointAtLength(wrapLength(midDistance));

        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w / 2;
        var cy = h / 2;
        var dx = mid.x - cx;
        var dy = mid.y - cy;

        var sx = Math.abs(dx) > 0.0001 ? (w / 2) / Math.abs(dx) : Infinity;
        var sy = Math.abs(dy) > 0.0001 ? (h / 2) / Math.abs(dy) : Infinity;
        var scaleToEdge = Math.min(sx, sy);

        var edgeX = cx + dx * scaleToEdge;
        var edgeY = cy + dy * scaleToEdge;
        var pushX = edgeX - mid.x;
        var pushY = edgeY - mid.y;

        for (var i = 0; i <= samples; i++) {
          var t = i / samples;
          var distance = start + blockLength * t;

          var o = offsetPoint(distance, -half);
          var inn = offsetPoint(distance, half);

          outer.push({
            x: o.x + pushX,
            y: o.y + pushY
          });

          inner.push({
            x: inn.x + pushX,
            y: inn.y + pushY
          });
        }

        var parts = [];
        parts.push('M ' + outer[0].x.toFixed(3) + ' ' + outer[0].y.toFixed(3));

        for (var j = 1; j < outer.length; j++) {
          parts.push('L ' + outer[j].x.toFixed(3) + ' ' + outer[j].y.toFixed(3));
        }

        for (var k = inner.length - 1; k >= 0; k--) {
          parts.push('L ' + inner[k].x.toFixed(3) + ' ' + inner[k].y.toFixed(3));
        }

        parts.push('Z');
        secondBlock.setAttribute('d', parts.join(' '));
      }

      function update() {
        var now = new Date();

        setClock(now);
        drawSecondBlock(now);

        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);

      setupPath();
      update();
    })();
  </script>
</body>
</html>
