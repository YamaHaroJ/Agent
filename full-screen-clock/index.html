<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clock" />
  <meta name="theme-color" content="#000000" />
  <title>Full Screen Clock</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      min-width: 100dvw;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    #edge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #track {
      fill: none;
      stroke: rgba(255,255,255,.10);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #second-path {
      fill: none;
      stroke: rgba(255,255,255,.98);
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(255,255,255,.18));
    }

    #clock {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      letter-spacing: -0.045em;
      line-height: 0.9;
      font-size: min(18vw, 26vh);
      text-align: center;
      z-index: 2;
    }

    #soundcloud {
      position: absolute;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(255,255,255,.09);
      color: #fff;
      padding: 12px 18px;
      min-width: 170px;
      border-radius: 999px;
      font: 500 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    #soundcloud:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255,255,255,.16);
    }

    @media (orientation: landscape) {
      #clock { font-size: min(13vw, 30vh); }
      #soundcloud {
        bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Full screen clock">
    <svg id="edge-svg" aria-hidden="true" preserveAspectRatio="none">
      <path id="track"></path>
      <path id="second-path"></path>
    </svg>

    <div id="clock">12:00:00 AM</div>
    <button id="soundcloud" type="button">Open SoundCloud</button>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      var soundcloud = document.getElementById('soundcloud');
      var svg = document.getElementById('edge-svg');
      var track = document.getElementById('track');
      var secondPath = document.getElementById('second-path');

      var totalLength = 0;
      var segmentLength = 0;

      function setClock(d) {
        var h = d.getHours();
        var m = String(d.getMinutes()).padStart(2, '0');
        var s = String(d.getSeconds()).padStart(2, '0');
        var suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        clock.textContent = h + ':' + m + ':' + s + ' ' + suffix;
      }

      function roundedRectPath(x, y, w, h, r) {
        return [
          'M', x + r, y,
          'H', x + w - r,
          'Q', x + w, y, x + w, y + r,
          'V', y + h - r,
          'Q', x + w, y + h, x + w - r, y + h,
          'H', x + r,
          'Q', x, y + h, x, y + h - r,
          'V', y + r,
          'Q', x, y, x + r, y,
          'Z'
        ].join(' ');
      }

      function setupPath() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

        var inset = 11;
        var radius = Math.max(28, Math.min(48, Math.min(w, h) * 0.055));
        var d = roundedRectPath(inset, inset, w - inset * 2, h - inset * 2, radius);

        track.setAttribute('d', d);
        secondPath.setAttribute('d', d);

        totalLength = secondPath.getTotalLength();
        segmentLength = Math.max(90, Math.min(180, totalLength * 0.075));
        secondPath.style.strokeDasharray = segmentLength + ' ' + totalLength;
      }

      function setSegment(d) {
        if (!totalLength) return;
        var seconds = d.getSeconds() + d.getMilliseconds() / 1000;
        var progress = seconds / 60;
        secondPath.style.strokeDashoffset = String(totalLength - (progress * totalLength));
      }

      function update() {
        var now = new Date();
        setClock(now);
        setSegment(now);
        requestAnimationFrame(update);
      }

      soundcloud.addEventListener('click', function () {
        window.location.href = 'https://soundcloud.com/';
      });

      window.addEventListener('resize', setupPath);
      setupPath();
      update();
    })();
  </script>
</body>
</html>
